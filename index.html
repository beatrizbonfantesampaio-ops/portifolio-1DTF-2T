<!DOCTYPE html><!--0 Doctype indica qual a linguagem da programação que está sendo usada, nesse caso ,o HTNL.-->
<html lang="en"><!--início do código-->
<head><!--início do cabeçalho do documento.Dentro dessa tag pode ser inseridas folhas de estilo e scripts .Os itens inseridos aqui não aparecem no navegador -->
    <meta charset="UTF-8"><!--indica quais serão os caracteres(chaeacter set ou charset)será utilizado para renderizar o texto da página.O UTF-8identifica os caracteres da língua portuguesa-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fornece os metados da sua páginas para o navegador-->
    <title>Portifólio</title> <!--título do projeto-->
</head> <!--fim do cabeçalho do documento-->
<body> <!--Nesse espaço está contido o coteúod visual da página. As tags que representam texto,botões e outros, devem ser adicionadas nesse intervalo-->
    
</body>
</html>
